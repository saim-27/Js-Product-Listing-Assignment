<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="custom-nav container d-flex justify-content-between align-items-center mt-3">
        <div class="filter-group d-flex justify-content-between align-items-center">

            <select id="brandFilter" class="custom-select">
                <option value="">Brand</option>
                <option value="Adidas">Adidas</option>
                <option value="Nike">Nike</option>
                <option value="Puma">Puma</option>
            </select>

            <select id="colorFilter" class="custom-select">
                <option value="">Color</option>
                <option value="Blue">Blue</option>
                <option value="Black">Black</option>
                <option value="White">White</option>
            </select>

            <select id="sizeFilter" class="custom-select">
                <option value="">Size</option>
                <option value="Large">Large</option>
                <option value="Medium">Medium</option>
                <option value="Small">Small</option>
            </select>

            <select id="priceFilter" class="custom-select">
                <option value="">Price</option>
                <option value="20">Under $20</option>
                <option value="50">Under $50</option>
                <option value="100">Under $100</option>
            </select>

        </div>
        <div class="search-group">
            <button id="searchBtn" type="button" class="custom-btn">Search</button>
        </div>
    </nav>

    <div class="container mt-5 row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4 mx-auto" id="productContainer"></div>

    <script src="./JS/script.js"></script>
</body>

</html>
